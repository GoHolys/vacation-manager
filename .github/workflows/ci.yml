name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_manager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation_manager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: vacation
      DB_PASSWORD: vacation
      DB_TEST_NAME: vacation_manager_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API end-to-end tests (PostgreSQL)
        run: npm run test:e2e
      - run: npm run build

  browser:
    name: Browser end-to-end & accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_manager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation_manager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: vacation
      DB_PASSWORD: vacation
      DB_TEST_NAME: vacation_manager_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
